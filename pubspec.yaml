name: smart_attendance_app
description: Smart QR-Code Attendance System with Live Notifications
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  fl_chart: ^0.69.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
